<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VSA Live · Vessel Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F1EA;--card:#FFFFFF;--ink:#15171A;--muted:#4A4F57;--line:#D9D3C7;--soft:#E6E0D4;--row:#EFEAE0;
  --blue:#1D4ED8;--on-blue:#FFFFFF;--orange:#B45309;--on-orange:#FFFFFF;--o-bg:#FFF7ED;--o-ink:#7C2D12;
  --red:#B91C1C;--r-bg:#FEE2E2;--r-ink:#7F1D1D;--green:#15803D;--g-bg:#DCFCE7;--g-ink:#14532D;
  --head:#15171A;--head-ink:#F4F1EA;--head-muted:#D6D1C6;--accent:#FDBA74;--done:#5A5F66;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;--body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:84px}
header.top{background:var(--head);color:var(--head-ink);padding:18px 20px 16px;display:flex;flex-direction:column;gap:6px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{font-size:12px;font-weight:600;padding:4px 8px;border-radius:4px}
.chip.live{background:var(--accent);color:#15171A}
.chip.off{background:var(--soft);color:var(--ink)}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05}
.sub{font-size:14px;color:var(--head-muted)}
.strip{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:10px;font-size:14px}
.strip .r{margin-left:auto;color:var(--muted)}
.strip strong{color:var(--ink);font-weight:600}
.alert{padding:12px 20px;display:flex;flex-direction:column;gap:2px;border-bottom:3px solid}
.alert b{font-size:15px;font-weight:600}
.alert span{font-size:14px}
.alert.o{background:var(--o-bg);border-color:var(--orange);color:var(--o-ink)}
.alert.r{background:var(--r-bg);border-color:var(--red);color:var(--r-ink)}
.alert.brk{background:var(--accent);border-color:var(--accent);color:#15171A;flex-direction:row;justify-content:space-between;align-items:center}
.alert.brk b{font-family:var(--display);font-size:22px;letter-spacing:.04em}
main{padding:20px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.pad{padding:18px 20px}
.lbl{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.big{font-family:var(--display);font-weight:700;line-height:.9}
.hero-n{font-size:112px}
.bar{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:7px}
.bar.sm{height:8px}.bar.sm>i{background:var(--blue)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px}
.kv .k{color:var(--muted)}
.hr{border-top:1px solid var(--soft);margin-top:6px;padding-top:12px;display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{padding:16px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;text-align:left;cursor:pointer}
.tile.fc{border:2px solid var(--orange)}
.tile.fc.dash{border-style:dashed}
.tag{align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.08em;padding:3px 6px;border-radius:4px}
.tag.fc{background:var(--orange);color:var(--on-orange)}
.tag.calc{background:var(--soft);color:var(--ink)}
.tag.bad{background:var(--r-ink);color:var(--card)}
.tile .v{font-size:56px}
.note{font-size:13px;color:var(--muted);line-height:1.4}
.link{font-size:13px;font-weight:600;color:var(--blue);margin-top:2px}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h span{font-size:14px;color:var(--muted)}
.banner{background:var(--head);color:var(--head-ink);border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:12px}
.banner .big{font-size:36px}
.rows{display:flex;flex-direction:column;overflow:hidden}
.row{padding:12px 16px;border-bottom:1px solid var(--row);display:flex;flex-direction:column;gap:8px}
.row:last-child{border-bottom:0}
.rowbtn{background:none;border:0;border-bottom:1px solid var(--row);width:100%;text-align:left;cursor:pointer;min-height:56px}
.rowbtn:last-child{border-bottom:0}
.line{display:flex;align-items:center;gap:12px}
.dn{width:56px;font-family:var(--display);font-weight:700;font-size:26px}
.rn{margin-left:auto;text-align:right}
.rn .big{font-size:26px}
.rn small{font-size:14px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;letter-spacing:.03em;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.p-active{background:var(--blue);color:var(--on-blue)}
.p-paused{background:var(--o-bg);color:var(--o-ink);border:1.5px solid var(--orange);padding:3px 9px}
.p-not{border:1.5px solid var(--ink);padding:3px 9px}
.p-done{background:var(--soft);color:var(--muted)}
.p-unk{border:1.5px dashed var(--muted);color:var(--muted);padding:3px 9px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.bchip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.st-ok{display:inline-flex;align-items:center;gap:6px;background:var(--g-bg);color:var(--g-ink);border:1.5px solid var(--green);border-radius:999px;padding:4px 10px 4px 6px;font-size:12px;font-weight:600}
.st-bad{display:inline-flex;align-items:center;gap:6px;background:var(--r-bg);color:var(--r-ink);border:1.5px solid var(--red);border-radius:999px;padding:4px 10px 4px 6px;font-size:12px;font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--head);display:flex;justify-content:center;padding:0 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:560px;width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{background:none;border:0;border-top:3px solid transparent;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--head-muted);font-size:12px;font-weight:600;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--blue);color:var(--on-blue);border:0;border-radius:999px;min-height:56px;padding:0 22px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer;z-index:6;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.x{background:var(--soft);border:0;border-radius:999px;min-width:44px;min-height:44px;cursor:pointer;font-size:18px}
.seg{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.seg button{min-height:48px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
label.f input,label.f select{min-height:52px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:0 14px;font-size:20px;font-weight:500}
.fr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.go{min-height:56px;border:0;border-radius:12px;background:var(--blue);color:var(--on-blue);font-size:17px;font-weight:600;cursor:pointer}
.go:disabled{opacity:.5;cursor:default}
.ghost{min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:15px;font-weight:600;cursor:pointer}
.trk{align-self:flex-start;margin-top:8px;min-height:40px;padding:0 12px;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.pos{color:var(--red);font-weight:600}
.err{background:var(--r-bg);color:var(--r-ink);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500}
.ok{background:var(--g-bg);color:var(--g-ink);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;padding:6px 0}
table.t td{padding:8px 0;border-top:1px solid var(--row)}
.num{text-align:right}
.red-h{color:var(--red);font-weight:600}
.scroll{overflow-x:auto}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

<div class="app">
  <div id="view"></div>

<script>
(function(){

/* ---------- state ---------- */

/* ---------- helpers ---------- */

function iso(){return new Date().toISOString();}
function pct(a,b){return b?(a/b*100):null;}
function ico(name,col){var P={

 decks:'<path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 16l8 4 8-4"/>',

 plus:'<path d="M12 5v14M5 12h14"/>',

 return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="'+(col||'currentColor')+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+P[name]+'</svg>';}
var OK_DOT='<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="9" fill="currentColor"/><path d="M5 9.5l2.6 2.5L13 6.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var BAD_DOT='<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="9" fill="currentColor"/><path d="M9 4.5v5.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="13" r="1.2" fill="#fff"/></svg>';

/* ---------- calculations (protocol v1.1 / instructions v2.1) ---------- */
function deckCalc(d,st){
  st=st||{};var status=st.status||'notStarted';
  var hatches=d.hatches.map(function(h){
    var qty=h.items.reduce(function(s,i){return s+i.qty;},0),rem;
    if(status==='complete')rem=0;else if(status==='notStarted')rem=qty;
    else{var v=st.hatchRemaining?st.hatchRemaining[h.h]:undefined;rem=(typeof v==='number')?v:null;}
    return {h:h.h,items:h.items,qty:qty,rem:rem};});
  var start=hatches.reduce(function(s,h){return s+h.qty;},0),rem;
  if(status==='complete')rem=0;else if(status==='notStarted')rem=start;
  else if(status==='unknown')rem=null;
  else if(hatches.every(function(h){return h.rem!=null;}))rem=hatches.reduce(function(s,h){return s+h.rem;},0);
  else if(typeof st.deckRemaining==='number')rem=st.deckRemaining;
  else rem=null;
  var bs={},br={};
  hatches.forEach(function(h){h.items.forEach(function(i){bs[i.brand]=(bs[i.brand]||0)+i.qty;});});
  var brands=Object.keys(bs);
  if(rem===0)brands.forEach(function(b){br[b]=0;});
  else if(rem===start)brands.forEach(function(b){br[b]=bs[b];});
  else if(rem==null)brands.forEach(function(b){br[b]=null;});
  else if(brands.length===1)br[brands[0]]=rem;
  else{var ok=true;brands.forEach(function(b){br[b]=0;});
    hatches.forEach(function(h){
      if(h.rem==null){ok=false;return;}
      if(h.items.length===1)br[h.items[0].brand]+=h.rem;
      else if(h.rem===0){}
      else if(h.rem===h.qty)h.items.forEach(function(i){br[i.brand]+=i.qty;});
      else ok=false;});
    if(!ok)brands.forEach(function(b){br[b]=null;});}
  return {id:d.id,label:d.label,heights:d.heights||[],status:status,hatches:hatches,start:start,rem:rem,brandRem:br,brandStart:bs,st:st};
}
var BRK=60,VAN_MIN=1.85;
function heightInfo(d){
  var hs=(d.heights||[]).slice(),st=(S.decks&&S.decks[d.id])||{},conf=st.heightConfirmed||null;
  var stow=hs.filter(function(x){return x.current;})[0]||null;
  var cur=conf?conf.m:(stow?stow.m:null);
  var canLower=hs.some(function(x){return x.m<VAN_MIN;});
  var level=cur==null?'unknown':cur<VAN_MIN?'hard':(!conf&&canLower)?'soft':'ok';
  return {cur:cur,conf:conf,stow:stow,heights:hs,canLower:canLower,level:level,
    lowest:hs.reduce(function(m,x){return m==null||x.m<m?x.m:m;},null)};}
function hid(day,hm){return (day>1?'d'+day:'')+'p'+hm.replace(':','');}
function curDay(){return (S.ops&&S.ops.day)||1;}
function dayStartMin(day){var B=S.baseline||{};return day>1?toMin((S.plan&&S.plan.nextStart)||B.start||'08:00'):toMin(B.start||'08:00');}
function dayHM(abs){var d=Math.floor(abs/1440);return (d>0?'Day '+(d+1)+' · ':'')+toHM(abs-d*1440);}
function isShort(startHM,breaks){var s=toMin(startHM);return breaks.some(function(b){return b===s+60;});}
function compute(){
  var B=S.baseline;if(!B||!B.decks)return null;
  var breaks=(B.breaks||[]).map(toMin).sort(function(a,b){return a-b;});
  var dests=B.destinations||[];
  var cb=dests.reduce(function(m,d){return Math.max(m,d.clearBy||0);},0);
  var decks=B.decks.map(function(d){var c=deckCalc(d,S.decks[d.id]);c.hi=heightInfo(d);return c;});
  var start=decks.reduce(function(s,d){return s+d.start;},0);
  var known=decks.every(function(d){return d.rem!=null;});
  var vRem=known?decks.reduce(function(s,d){return s+d.rem;},0):null;
  var progress=vRem==null?null:start-vRem;
  var missing=decks.filter(function(d){return d.rem==null;}).map(function(d){return d.label;});
  var periods=Object.keys(S.hourly).map(function(k){var h=S.hourly[k];if(h)h.day=h.day||1;return h;}).filter(function(h){return h&&typeof h.count==='number';})
    .sort(function(a,b){return (a.day-b.day)||(toMin(a.start)-toMin(b.start));});
  var prevP=null,prevS=false,prevD=1;periods.forEach(function(p){if(p.day!==prevD){prevP=null;prevS=false;prevD=p.day;}p.short=isShort(p.start,breaks);
    p.min=p.short?(typeof p.stopMin==='number'?p.stopMin:null):60;
    p.pace=p.min?p.count/(p.min/60):null;
    p.delta=(prevP==null||p.pace==null)?null:p.pace-prevP;p.deltaPct=(prevP&&p.pace!=null)?((p.pace-prevP)/prevP*100):null;
    p.deltaPaced=p.short||prevS;prevP=p.pace;prevS=p.short;});
  var kp=periods.filter(function(p){return p.min!=null;});
  var prodMin=kp.reduce(function(t,p){return t+p.min;},0),prodCount=kp.reduce(function(t,p){return t+p.count;},0);
  var pace=prodMin?prodCount/(prodMin/60):null;
  var unsetShort=periods.filter(function(p){return p.short&&p.min==null;}).map(function(p){return p.start;});
  var field=periods.reduce(function(s,p){return s+p.count;},0);
  var transit=progress==null?null:progress-field;
  var ha=periods.length?field/periods.length:null;
  // brands
  var bStart={},bRem={},order=[];
  decks.forEach(function(d){Object.keys(d.brandStart).forEach(function(b){
    if(!(b in bStart)){bStart[b]=0;bRem[b]=0;order.push(b);}
    bStart[b]+=d.brandStart[b];
    if(bRem[b]!=null)bRem[b]=d.brandRem[b]==null?null:bRem[b]+d.brandRem[b];});});

  var bField={},unsplit=0;
  periods.forEach(function(p){if(p.brands&&typeof p.brands==='object'){Object.keys(p.brands).forEach(function(b){bField[b]=(bField[b]||0)+p.brands[b];});}else unsplit+=p.count;});

  var ops=S.ops||{};
  return {B:B,breaks:breaks,cb:cb,decks:decks,start:start,vRem:vRem,progress:progress,missing:missing,
    periods:periods,field:field,transit:transit,ha:ha,brands:brands,brandsLeft:brandsLeft,eta:eta,
    fieldBal:start-field,onBreak:!!ops.onBreak,shiftEnded:!!ops.shiftEnded,recon:!!(ops.onBreak||ops.shiftEnded),day:ops.day||1,ops:ops,unsplit:unsplit,pace:pace,prodMin:prodMin,unsetShort:unsetShort,
    drivers:(function(){for(var i=periods.length-1;i>=0;i--){if(typeof periods[i].drivers==='number'&&periods[i].drivers>0)return {n:periods[i].drivers,src:'logged '+periods[i].start};}
      var L=B.labor||{};return typeof L.autoDrivers==='number'?{n:L.autoDrivers,src:'labor order'}:null;})(),
    issues:(S.issues.items||[]).filter(function(i){return i.status==='open';})};
}
function etaCalc(rem,periods,breaks,cb){
  var out={eta:null,rate:null,k:0,from:null,reason:null};
  if(rem===0){out.reason='done';return out;}
  if(!periods.length){out.reason='Needs production data';return out;}
  var use=periods.filter(function(p){return p.pace!=null;}).slice(-2);
  if(!use.length){out.reason='Set the stoppage time on the short hour';return out;}

function hourGraph(M){
  var P=M.periods,multi=P.some(function(p){return p.day>1;});
  var vals=P.map(function(p){return p.pace!=null?p.pace:p.count;}),avg=M.pace;
  var lo=Math.min.apply(null,vals.concat(avg!=null?[avg]:[])),hi=Math.max.apply(null,vals.concat(avg!=null?[avg]:[]));
  var span=Math.max(hi-lo,20),raw=span*1.5/4,steps=[5,10,20,25,50,100],step=steps.filter(function(x){return x>=raw;})[0]||100;
  lo=Math.max(0,Math.floor((lo-span*0.2)/step)*step);hi=Math.ceil((hi+span*0.25)/step)*step;var nT=Math.round((hi-lo)/step);
  var W=340,H=220,L=36,R=26,T=16,Bm=40,iw=W-L-R,ih=H-T-Bm;
  var pad=18;function x(i){return L+pad+(P.length===1?(iw-2*pad)/2:i*(iw-2*pad)/(P.length-1));}
  function y(v){return T+ih-(v-lo)/(hi-lo)*ih;}
  var g='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Hourly pace line graph" style="display:block;font-family:var(--body)">';
  for(var k=0;k<=nT;k++){var v=lo+step*k,yy=y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--row)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+Math.round(v)+'</text>';}
  if(avg!=null)g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(avg)+'" y2="'+y(avg)+'" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>';
  g+='<polyline fill="none" stroke="var(--blue)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="'+P.map(function(p,i){return x(i)+','+y(vals[i]);}).join(' ')+'"/>';
  P.forEach(function(p,i){var cx=x(i),cy=y(vals[i]),sh=p.short;
    g+='<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="'+(sh?'var(--orange)':'var(--blue)')+'" stroke="var(--card)" stroke-width="2"/>'+
      '<text x="'+cx+'" y="'+(cy-10)+'" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">'+p.count+'</text>'+
      '<text x="'+cx+'" y="'+(H-Bm+16)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+(multi&&p.day>1?'D'+p.day+' ':'')+p.start.slice(0,2)+'</text>';});
  g+='</svg>';
  var hasShort=P.some(function(p){return p.short;});
  return '<section class="card pad sec"><div class="sec-h"><h2>Hourly pace</h2><span>autos per hour</span></div>'+g+
    '<div class="note">Numbers are each hour’s count; the line is its pace per full hour. Dashed line = average pace'+(avg!=null?' ('+Math.round(avg)+'/hr)':'')+'.'+(hasShort?' <span style="color:var(--o-ink);font-weight:600">Orange</span> = pre-break hour, pace adjusted for the stoppage.':'')+'</div></section>';}

  return h;}
function deckSheet(d){
  var st=d.st||{},hr=st.hatchRemaining||{};
  var h='<div class="sh-h"><h2>'+esc(d.label)+' · '+fmt(d.start)+' autos</h2><button class="x" data-act="close" aria-label="Close">✕</button></div>'+
    '<div class="line">'+pill(d.status,st.skipped)+'<span class="rn"><span class="big" style="font-size:30px">'+fmt(d.rem)+'</span><small> remaining</small></span></div>'+
    '<div class="chips">'+hchip(d.hi)+'<span class="note">Possible: '+d.hi.heights.map(function(x){return x.m.toFixed(2);}).join(' / ')+' m</span></div>'+
    '<div class="note">Deck heights are confirmed on the Plan tab.</div>';
  if(canEdit()){
    var S5=[['notStarted','Not started'],['active','Active'],['paused','Paused'],['complete','Complete'],['unknown','Unknown']];
    h+='<div class="seg" role="group" aria-label="Deck status" id="f-st" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+S5.map(function(s){return '<button data-st="'+s[0]+'" aria-pressed="'+(d.status===s[0])+'">'+s[1]+'</button>';}).join('')+'</div>'+
      '<label style="display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;font-weight:600"><input id="f-sk" type="checkbox" style="width:24px;height:24px"'+(st.skipped?' checked':'')+'>Skipped: passed over, still aboard (Not started only)</label>';
    h+='<div class="lbl">REMAINING BY HATCH (H4 → H1) · leave blank if unknown</div><div class="fr">'+
      d.hatches.map(function(x){var v=d.status==='active'||d.status==='paused'?(typeof hr[x.h]==='number'?hr[x.h]:''):'';
        return '<label class="f">'+esc(x.h)+' · of '+x.qty+' <span class="note" style="font-weight:400">'+x.items.map(function(i){return esc(i.brand)+' '+i.qty;}).join(' + ')+'</span><input data-hatch="'+esc(x.h)+'" data-max="'+x.qty+'" type="number" inputmode="numeric" min="0" max="'+x.qty+'" value="'+v+'"></label>';}).join('')+'</div>'+
      '<label class="f">Or deck total remaining<input id="f-dr" type="number" inputmode="numeric" min="0" max="'+d.start+'" value="'+(typeof st.deckRemaining==='number'&&(d.status==='active'||d.status==='paused')?st.deckRemaining:'')+'"></label>'+
      '<label class="f">Time of this update (clear it if unknown)<input id="f-dt" type="time" value="'+nowHM()+'"></label>'+
      '<div class="note">Complete sets remaining to 0 and records the cleared brands. Not started keeps the full count.</div><button class="go" data-act="save-deck" data-id="'+esc(d.id)+'">Save deck update</button>';
  }else{
    h+='<div class="card rows">'+d.hatches.map(function(x){return '<div class="row"><div class="sec-h"><strong>'+esc(x.h)+'</strong><span>'+fmt(x.rem)+' of '+x.qty+'</span></div><div class="note">'+x.items.map(function(i){return esc(i.brand)+' '+i.qty;}).join(' + ')+'</div></div>';}).join('')+'</div>';}
  if(st.history&&st.history.length)h+='<div class="note">Previous: '+st.history.slice(-3).map(function(x){return esc(x.time||'')+' '+esc(x.status)+(typeof x.rem==='number'?' ('+x.rem+')':'');}).join(' · ')+'</div>';
  return h;}

/* ---------- writes ---------- */
function intVal(id){var el=document.getElementById(id);if(!el||el.value==='')return null;var n=Number(el.value);return Number.isInteger(n)?n:NaN;}
function fail(t){renderSheet('<div class="err">'+esc(t)+'</div>');}
function writeErr(e){if(e&&e.code==='invalid_argument'){S.readOnly=true;render();fail('You have view-only access to this vessel.');}
  else if(e&&e.code==='quota_exceeded')fail('Storage is full for this page. Tell the page owner.');
  else fail('Not saved: '+((e&&e.message)||'connection problem')+'. Try again.');}
function saveHour(){
  var M=compute(),per=document.getElementById('f-per').value,c=intVal('f-cnt'),dr=intVal('f-drv');
  if(c!=null&&(isNaN(c)||c<0))return fail('Enter the whole-number count for this hour.');
  if(dr!=null&&(isNaN(dr)||dr<0))return fail('Drivers must be a whole number.');
  var bf={},filled=0,bad=null;
  document.querySelectorAll('[data-bf]').forEach(function(inp){if(inp.value==='')return;var n=Number(inp.value);
    if(!Number.isInteger(n)||n<0)bad=inp.getAttribute('data-bf')+' must be a whole number.';else{bf[inp.getAttribute('data-bf')]=n;filled++;}});
  if(bad)return fail(bad);
  if(filled&&filled<M.brands.length)return fail('Fill every brand, or leave the split blank.');
  var sum=filled?Object.keys(bf).reduce(function(t,k){return t+bf[k];},0):null;
  if(c==null&&sum!=null)c=sum;
  if(c==null)return fail('Enter the count for this hour.');
  if(sum!=null&&sum!==c)return fail('Brand split adds to '+sum+' but the hour total is '+c+'. Fix one.');
  var stopMin=null;if(M.breaks.indexOf(toMin(per)+60)>=0){var sb=document.querySelector('#f-stop button[aria-pressed="true"]');if(!sb)return fail('Pick when production stopped before the '+toHM(toMin(per)+60)+' break.');stopMin=+sb.getAttribute('data-stop');}
  var cd=curDay(),id=hid(cd,per),prev=S.hourly[id];
  var nf=M.field-(prev?prev.count:0)+c;
  if(nf>M.start)return fail('This makes the field total '+fmt(nf)+', which exceeds starting cargo ('+fmt(M.start)+') by '+fmt(nf-M.start)+'. Check the count.');
  var body={start:per,day:cd,count:c,drivers:dr,brands:filled?bf:null,stopMin:stopMin,loggedAt:iso(),
    history:prev?(prev.history||[]).concat([{count:prev.count,brands:prev.brands||null,drivers:prev.drivers==null?null:prev.drivers,loggedAt:prev.loggedAt}]).slice(-10):[]};
  S.db.doc('hourly/'+id).set(body).then(function(){closeSheet();},writeErr);}
function setStop(id,m){S.db.doc('hourly/'+id).update({stopMin:m}).catch(function(e){if(e&&e.code==='invalid_argument'){S.readOnly=true;render();}});}
function confHeight(id,m){var prev=S.decks[id]?JSON.parse(JSON.stringify(S.decks[id])):{status:'notStarted'};
  prev.heightConfirmed={m:m,hm:nowHM(),loggedAt:iso()};delete S.rechk[id];
  S.db.doc('decks/'+id).set(prev).then(function(){if(S.sheet&&S.sheet.kind==='deck')renderSheet();},function(e){if(e&&e.code==='invalid_argument'){S.readOnly=true;render();}});}
function addIssue(text,key){
  var items=(S.issues.items||[]).concat([{id:'i'+Date.now().toString(36),key:key||null,text:text,openedAt:iso(),openedHM:nowHM(),status:'open'}]).slice(-60);
  return S.db.doc('ops/issues').set({items:items});}
function saveIssue(){var t=(document.getElementById('f-it')||{}).value||'';t=t.trim();if(!t)return fail('Describe what doesn’t match.');
  addIssue(t).then(function(){closeSheet();},writeErr);}
function resolveIssue(id){var items=(S.issues.items||[]).map(function(i){return i.id===id?Object.assign({},i,{status:'resolved',resolvedAt:iso(),resolvedHM:nowHM()}):i;});
  S.db.doc('ops/issues').set({items:items}).catch(function(e){openSheet('log',{sub:'issue'});writeErr(e);});}
function saveDeck(id){
  var M=compute(),d=M.decks.filter(function(x){return x.id===id;})[0];
  var stBtn=document.querySelector('#f-st button[aria-pressed="true"]'),status=stBtn?stBtn.getAttribute('data-st'):d.status;
  var hr={},bad=null;
  document.querySelectorAll('[data-hatch]').forEach(function(inp){if(inp.value==='')return;var n=Number(inp.value),mx=+inp.getAttribute('data-max');
    if(!Number.isInteger(n)||n<0)bad=inp.getAttribute('data-hatch')+' must be a whole number.';
    else if(n>mx)bad=inp.getAttribute('data-hatch')+' exceeds its '+mx+' autos by '+(n-mx)+'. Check the count.';
    else hr[inp.getAttribute('data-hatch')]=n;});
  if(bad)return fail(bad);
  var dr=intVal('f-dr');if(dr!=null&&(isNaN(dr)||dr<0))return fail('Deck total must be a whole number.');
  if(dr!=null&&dr>d.start)return fail('Deck total exceeds '+d.label+'’s '+d.start+' autos by '+(dr-d.start)+'. Check the count.');
  var hk=Object.keys(hr);
  if(dr!=null&&hk.length===d.hatches.length){var sm=hk.reduce(function(s,k){return s+hr[k];},0);if(sm!==dr)return fail('Hatch counts add to '+sm+' but deck total says '+dr+'. Fix one.');}
  if(status==='complete'||status==='notStarted'||status==='unknown'){hr={};dr=null;}
  var t=(document.getElementById('f-dt')||{}).value||'';
  var prev=S.decks[id];var hist=prev?(prev.history||[]).concat([{status:prev.status,rem:d.rem,time:prev.time||'',loggedAt:prev.loggedAt}]).slice(-10):[];
  var sk=status==='notStarted'&&!!(document.getElementById('f-sk')||{}).checked;
  S.db.doc('decks/'+id).set({heightConfirmed:(prev&&prev.heightConfirmed)||null,status:status,skipped:sk,hatchRemaining:hr,deckRemaining:dr,time:t,loggedAt:iso(),history:hist}).then(function(){closeSheet();},writeErr);}
function startBreak(){var t=document.getElementById('f-bt').value;if(!t)return fail('Enter the break start time.');
  var o=Object.assign({},S.ops);o.onBreak=true;o.breakStart=t;o.startedAt=iso();o.log=o.log||[];
  S.db.doc('ops/state').set(o).then(function(){closeSheet();},writeErr);}
function endBreak(){var t=document.getElementById('f-bt').value;if(!t)return fail('Enter the time work resumed.');
  var o=Object.assign({},S.ops);o.log=(o.log||[]).concat([{start:o.breakStart,end:t}]).slice(-20);o.onBreak=false;o.lastEnd=t;
  S.db.doc('ops/state').set(o).then(function(){closeSheet();},writeErr);}
function saveClerk(){var r=intVal('f-cr'),t=document.getElementById('f-ct').value;
  if(r==null||isNaN(r)||r<0)return fail('Enter the clerk’s remaining count as a whole number.');
  if(!t)return fail('Enter the time the clerk gave the count.');
  var e=(S.clerk.entries||[]).concat([{remaining:r,time:t,loggedAt:iso()}]).slice(-50);
  S.db.doc('ops/clerk').set({entries:e}).then(function(){closeSheet();},writeErr);}
function endShift(){var t=document.getElementById('f-se2').value;if(!t)return fail('Enter the time the shift ended.');
  var o=Object.assign({},S.ops);o.shiftEnded=true;o.shiftEnd=t;o.onBreak=false;o.startedAt=iso();o.day=o.day||1;
  S.db.doc('ops/state').set(o).then(function(){closeSheet();},writeErr);}
function nextDay(){var t=document.getElementById('f-bt').value;if(!t)return fail('Enter the start time.');
  var o=Object.assign({},S.ops);o.log=(o.log||[]).concat([{start:'Shift end '+o.shiftEnd,end:'Day '+((o.day||1)+1)+' '+t}]).slice(-20);o.shiftEnded=false;o.day=(o.day||1)+1;
  var p=Object.assign({},S.plan);p.nextStart=t;
  S.db.doc('ops/plan').set(p).then(function(){return S.db.doc('ops/state').set(o);}).then(function(){closeSheet();},writeErr);}
function saveShift(){var m=document.querySelector('#f-mode button[aria-pressed="true"]'),two=m&&m.getAttribute('data-mode')==='two';
  var se=document.getElementById('f-se').value,ns=document.getElementById('f-ns').value;
  if(two&&!se)return fail('Enter when Day 1 ends.');if(!ns)return fail('Enter when the next day starts.');
  var p=Object.assign({},S.plan);p.shiftEnd=two?se:null;p.nextStart=ns;delete p.breakLenMin;
  S.db.doc('ops/plan').set(p).then(function(){closeSheet();},writeErr);}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-tab],[data-deck],[data-act],[data-sub],[data-st],[data-stop],[data-mode]');if(!t)return;
  if(t.hasAttribute('data-tab')){S.tab=t.getAttribute('data-tab');closeSheet();render();window.scrollTo(0,0);return;}
  if(t.hasAttribute('data-deck')){openSheet('deck',{id:t.getAttribute('data-deck')});return;}
  if(t.hasAttribute('data-sub')){S.sheet.sub=t.getAttribute('data-sub');renderSheet();return;}
  if(t.hasAttribute('data-mode')){t.parentNode.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed','false');});t.setAttribute('aria-pressed','true');return;}
  if(t.hasAttribute('data-stop')){t.parentNode.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed','false');});t.setAttribute('aria-pressed','true');return;}
  if(t.hasAttribute('data-st')){t.parentNode.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed','false');});t.setAttribute('aria-pressed','true');return;}
  var a=t.getAttribute('data-act');
  if(a==='bg'&&ev.target===t)return closeSheet();
  if(a==='close')return closeSheet();
  if(a==='log')return openSheet('log',{sub:'hour'});
  if(a==='shiftset')return openSheet('shift');
  if(a==='save-hour')return saveHour();
  if(a==='save-deck')return saveDeck(t.getAttribute('data-id'));
  if(a==='start-break')return startBreak();
  if(a==='end-break')return endBreak();
  if(a==='save-clerk')return saveClerk();
  if(a==='save-shift')return saveShift();
  if(a==='end-shift')return endShift();
  if(a==='next-day')return nextDay();
  if(a==='save-issue')return saveIssue();
  if(a==='demo')return setDemo(!S.demo);
  if(a==='hview'){S.hview=t.getAttribute('data-v');return render();}
  if(a==='rechk'){S.rechk[t.getAttribute('data-id')]=1;return render();}
  if(a==='confheight')return confHeight(t.getAttribute('data-id'),+t.getAttribute('data-m'));
  if(a==='setstop')return setStop(t.getAttribute('data-id'),+t.getAttribute('data-min'));
  if(a==='resolve')return resolveIssue(t.getAttribute('data-id'));
  if(a==='track'){t.disabled=true;return addIssue(t.getAttribute('data-text'),t.getAttribute('data-key')).catch(function(e){openSheet('log',{sub:'issue'});writeErr(e);});}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet)closeSheet();});
setInterval(function(){if(!S.sheet)render();},60000);

/* ---------- data ---------- */
function sub(ref,key,isCol){
  ref.onSnapshot(function(snap){
    S.connected=true;S.loaded[key]=true;
    var tgt=(S.demo&&DEMO_KEYS.indexOf(key)>=0)?S.real:S;
    if(isCol){var o={};snap.docs.forEach(function(d){if(d.exists)o[d.id]=d.data();});tgt[key]=o;}
    else tgt[key]=snap.exists?snap.data():(key==='baseline'?null:(key==='clerk'?{entries:[]}:(key==='issues'?{items:[]}:{})));
    render();
  },function(e){S.connected=false;S.err='Live data stopped ('+(e&&e.code||'error')+'). Reload the page.';render();});}
render();
(async function(){
  try{if(!window.claude||!window.claude.use){S.err='Open this page in Claude to see live vessel data.';render();return;}
    var db=await window.claude.use('db');
    if(!db){S.err='Live data isn’t available in this view. Open the page from its Claude link while signed in.';render();return;}
    S.db=db;render();
    var user=await window.claude.use('user');S.user=user;
    if(user){try{S.canWrite=await user.can('data.write');}catch(e){S.canWrite=null;}}
    sub(db.doc('vessel/baseline'),'baseline');sub(db.doc('ops/plan'),'plan');sub(db.doc('ops/state'),'ops');sub(db.doc('ops/clerk'),'clerk');sub(db.doc('ops/issues'),'issues');
    sub(db.collection('decks'),'decks',true);sub(db.collection('hourly'),'hourly',true);
    render();
  }catch(e){S.err='Could not connect to live data. Reload the page.';render();}
})();
})();
</script>
